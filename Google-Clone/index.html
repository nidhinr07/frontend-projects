<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <nav>
            <a href="#">About</a>
            <a href="#">Store</a>

            <div class="nav-right">
                <a href="#">Gmail</a>
                <a href="#">Images</a>
                <span class="apps">⋮⋮⋮</span>
                <button class="sign-in">Sign in</button>
            </div>
        </nav>
    </header>

    <main>
        <div class="google-logo">
            <span class="blue">G</span><span class="red">o</span><span class="yellow">o</span><span class="blue">g</span><span class="green">l</span><span class="red">e</span>
        </div>

        <div class="search-box">
            <span class="search-icon">⌕</span>
            <input type="text" id="searchInput">
            <span class="mic">🎤</span>
        </div>

        <div class="buttons">
            <button onclick="searchGoogle()">Google Search</button>
            <button onclick="luckySearch()">I'm Feeling Lucky</button>
        </div>

        <p class="language">
            Google offered in:
            <a href="#">हिन्दी</a>
            <a href="#">বাংলা</a>
            <a href="#">తెలుగు</a>
            <a href="#">தமிழ்</a>
            <a href="#">മലയാളം</a>
        </p>
    </main>

    <footer>
        <div class="footer-country">India</div>

        <div class="footer-links">
            <div>
                <a href="#">Advertising</a>
                <a href="#">Business</a>
                <a href="#">How Search works</a>
            </div>

            <div>
                <a href="#">Privacy</a>
                <a href="#">Terms</a>
                <a href="#">Settings</a>
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
